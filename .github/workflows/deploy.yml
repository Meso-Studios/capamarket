# Build the static site and publish it to GitHub Pages.
# PRs: type-check + build only. Pushes to main: build → (optional) migrate → deploy.
#
# The site talks to Supabase directly from the browser with the public key in
# src/lib/supabase.ts, so no secrets are needed to build or deploy.
# Optional repository secret: DATABASE_URL (Supabase session pooler URL). When set,
# db/schema.sql + db/api.sql are applied before each deploy.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          # Project pages live at https://<user>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: "1"
      # Without this, Pages' Jekyll step would drop the _next/ folder.
      - run: touch out/.nojekyll
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  migrate:
    name: Migrate database
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - if: env.DATABASE_URL == ''
        run: echo "::notice::DATABASE_URL secret not set; skipping migrations."
      - if: env.DATABASE_URL != ''
        uses: actions/checkout@v7
      - if: env.DATABASE_URL != ''
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: env.DATABASE_URL != ''
        run: npm ci && npm run db:migrate

  deploy:
    name: Deploy to Pages
    needs: [build, migrate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
